appId: com.sparklinlabs.superpowers
productName: Superpowers
copyright: Copyright © 2014-present Sparklin Labs & contributors
artifactName: superpowers-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: resources/icons

files:
  - out/**
  - resources/**
  - package.json

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: resources/icons/superpowers.icns
  category: public.app-category.developer-tools

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icons/superpowers.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/icons/superpowers-256.png
  category: Development
  maintainer: Superpowers contributors
